<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#1b1f3b" />
  <title>피아노 스타</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ===== 홈 ===== -->
  <section id="home" class="screen active">
    <header class="home-head">
      <div class="logo">🎹 피아노 스타</div>
      <div class="profile">
        <div class="level-badge"><span id="lvNum">1</span><small>레벨</small></div>
        <div class="xp-wrap">
          <div class="xp-label"><span id="lvTitle">새싹 피아니스트</span><span id="xpText">0 / 100 XP</span></div>
          <div class="xp-bar"><div id="xpFill"></div></div>
        </div>
        <div class="streak" title="연속 연습일">🔥 <b id="streakNum">0</b>일</div>
        <button class="icon-btn" id="btnBadges" title="배지">🏅</button>
        <button class="icon-btn" id="btnSettings" title="설정">⚙️</button>
      </div>
    </header>
    <div class="daily" id="dailyMsg"></div>
    <div class="song-toolbar">
      <h2>곡 목록</h2>
      <div class="toolbar-btns">
        <button class="btn ghost" id="btnPaste">📋 붙여넣기</button>
        <label class="btn ghost">📂 파일 열기<input type="file" id="fileInput" hidden /></label>
      </div>
    </div>
    <div id="songList" class="song-list"></div>
  </section>

  <!-- ===== 연주 ===== -->
  <section id="play" class="screen">
    <header class="play-head">
      <button class="icon-btn" id="btnBack" title="목록">←</button>
      <div class="song-title" id="playTitle"></div>
      <div class="seg" id="modeSeg">
        <button data-mode="rhythm" class="on" title="정해진 템포로 연주">🎵 리듬</button>
        <button data-mode="wait" title="맞게 칠 때까지 기다려줘요">🐢 연습</button>
      </div>
      <div class="tempo">
        <span>속도</span>
        <input type="range" id="tempoPct" min="50" max="120" step="5" value="100" />
        <b id="tempoText">100%</b>
      </div>
      <label class="toggle" title="메트로놈"><input type="checkbox" id="metroOn" /> 🥁</label>
      <button class="btn ghost" id="btnPreview">🎧 미리 듣기</button>
      <button class="btn primary" id="btnStart">▶ 시작</button>
    </header>
    <div class="hud">
      <div class="hud-score"><small>점수</small><b id="hudScore">0</b></div>
      <div class="hud-counts">
        <span class="c-blue">🔵 <b id="cntBlue">0</b></span>
        <span class="c-yellow">🟡 <b id="cntYellow">0</b></span>
        <span class="c-red">🔴 <b id="cntRed">0</b></span>
      </div>
      <div class="judge-pop" id="judgePop"></div>
      <div class="hud-combo" id="hudCombo"></div>
      <div class="mic-meter" title="마이크 입력"><div id="micLevel"></div></div>
    </div>
    <div class="score-wrap" id="scoreWrap">
      <div id="osmd"></div>
    </div>
    <div class="wait-bar" id="waitBar">
      <span id="waitHint">이 음을 쳐 보세요</span>
      <button class="btn ghost small" id="btnSkip">건너뛰기 ⏭</button>
    </div>
  </section>

  <!-- ===== 결과 ===== -->
  <section id="result" class="screen">
    <div class="result-card">
      <div class="grade" id="resGrade">S</div>
      <div class="res-score"><b id="resScore">0</b><small>점</small></div>
      <div class="res-msg" id="resMsg"></div>
      <div class="res-grid">
        <div class="c-blue">🔵 정확<b id="resBlue">0</b></div>
        <div class="c-yellow">🟡 아쉬움<b id="resYellow">0</b></div>
        <div class="c-red">🔴 미스<b id="resRed">0</b></div>
        <div>⚡ 최대 콤보<b id="resCombo">0</b></div>
      </div>
      <div class="heat-title">마디별 정확도 <small>(빨간 마디를 연습해 보세요)</small></div>
      <div class="heatmap" id="resHeat"></div>
      <div class="res-xp" id="resXp"></div>
      <div class="res-badges" id="resBadges"></div>
      <div class="res-actions">
        <button class="btn ghost" id="btnResList">곡 목록</button>
        <button class="btn primary" id="btnResRetry">🔁 다시 하기</button>
      </div>
    </div>
  </section>

  <!-- ===== 설정 ===== -->
  <div class="modal" id="settingsModal">
    <div class="modal-card">
      <h3>⚙️ 설정</h3>
      <div class="set-row">
        <label>마이크 감도</label>
        <input type="range" id="setSens" min="1" max="10" step="1" />
        <b id="setSensText"></b>
      </div>
      <div class="set-row">
        <label>판정 너그러움</label>
        <input type="range" id="setLenient" min="1" max="5" step="1" />
        <b id="setLenientText"></b>
      </div>
      <div class="set-row">
        <label>지연 보정</label>
        <input type="range" id="setLatency" min="0" max="400" step="10" />
        <b id="setLatencyText"></b>
      </div>
      <div class="calib">
        <button class="btn ghost" id="btnCalib">🎯 자동 보정</button>
        <span id="calibMsg">"딱" 소리에 맞춰 <b>가온 도(C4)</b>를 8번 치세요.</span>
      </div>
      <div class="calib">
        <button class="btn ghost" id="btnMicTest">🎤 마이크 테스트</button>
        <span id="micTestMsg">피아노를 쳐 보세요</span>
      </div>
      <div class="modal-actions">
        <button class="btn ghost danger" id="btnReset">기록 초기화</button>
        <button class="btn primary" id="btnCloseSettings">닫기</button>
      </div>
    </div>
  </div>

  <!-- ===== 배지 ===== -->
  <div class="modal" id="badgeModal">
    <div class="modal-card">
      <h3>🏅 내 배지</h3>
      <div class="badge-grid" id="badgeGrid"></div>
      <div class="modal-actions"><button class="btn primary" id="btnCloseBadges">닫기</button></div>
    </div>
  </div>

  <!-- ===== 붙여넣기 ===== -->
  <div class="modal" id="pasteModal">
    <div class="modal-card">
      <h3>📋 MusicXML 붙여넣기</h3>
      <p class="hint">Claude 악보 플레이어에서 <b>"MusicXML 복사"</b>를 누른 뒤, 아래 칸을 길게 눌러 붙여넣으세요.</p>
      <textarea id="pasteText" placeholder="&lt;?xml ... &lt;score-partwise ..."></textarea>
      <div class="modal-actions">
        <button class="btn ghost" id="btnPasteCancel">취소</button>
        <button class="btn primary" id="btnPasteOk">곡 추가</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="vendor/opensheetmusicdisplay.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
